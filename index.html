<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fe7141" />
    <link rel="canonical" href="https://www.collegecentre.in/" />
    <title>CollegeCentre — ₹199 / 24-Hour Job Hunt Platform for Students & Freshers</title>
    <meta name="description" content="Find relevant student and fresher jobs faster. ₹199 for a focused 24-hour job discovery sprint, keep your application tracker forever." />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CollegeCentre — ₹199 / 24-Hour Job Hunt Platform" />
    <meta property="og:description" content="Aggregated entry-level openings, deterministic skill matching, and zero subscription traps. Pay ₹199 once when you sprint—keep your applications forever." />
    <meta property="og:url" content="https://www.collegecentre.in/" />
    <meta property="og:site_name" content="CollegeCentre" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CollegeCentre — ₹199 / 24-Hour Job Hunt Platform" />
    <meta name="twitter:description" content="Aggregated entry-level openings, deterministic skill matching, and zero subscription traps. Pay ₹199 once when you sprint—keep your applications forever." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Geist Mono', monospace;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('collegecentre-theme');
          var isDark = saved === 'dark' || (!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
